
<div class="dropdown">
  <button class="dropdown-toggle" (click)="toggle($event)"><i class="fas fa-ellipsis-v"></i></button>
  @if (isOpen) {
    <div
      class="dropdown-menu"
      [style.top.px]="menuTop"
      [style.left.px]="menuLeft"
    >
      <button class="dropdown-item" (click)="onEdit()"><i class="fas fa-edit"></i> Editar</button>
      <button class="dropdown-item" (click)="onDelete()"><i class="fas fa-trash-alt"></i> Eliminar</button>
    </div>
  }
</div>
